name: Deploy SpeekTo.Me Server to EC2

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab UI

jobs:
  deploy:
    name: Deploy to AWS EC2 (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: server/go.sum

      - name: Build Statically Compiled Go Binaries (ARM64)
        run: |
          cd server
          
          # Build core server with stripped debug symbols for fast transfer
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o speektome-server .
          
          # Build benchmark binary
          cd benchmark
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o benchmark-run .

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:speektome-server

      - name: Copy Server Files to EC2 via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "server/speektome-server,server/setup_ec2.sh,server/.env.example,server/benchmark/benchmark-run"
          target: "speektome"
          strip_components: 1

      - name: Run setup_ec2.sh and restart speektome service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/speektome
            chmod +x speektome-server setup_ec2.sh
            if [ -f benchmark/benchmark-run ]; then
              chmod +x benchmark/benchmark-run
            fi
            
            ./setup_ec2.sh
            sudo systemctl restart speektome
            sudo systemctl status speektome --no-pager
