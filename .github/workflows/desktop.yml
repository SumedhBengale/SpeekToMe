name: Desktop
on:
  pull_request:
    paths: ['windows-client/**', '.github/workflows/desktop.yml']
  push:
    branches: [master]
    paths: ['windows-client/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libpulse-dev libasound2-dev libdbus-1-dev libssl-dev libxdo-dev cmake pkg-config
      - name: Check frontend scripts
        shell: bash
        working-directory: windows-client/frontend
        run: for script in bridge.js js/*.js; do node --check "$script"; done
      - name: Format
        working-directory: windows-client
        run: cargo fmt --check
      - name: Test
        working-directory: windows-client
        run: cargo test --locked
