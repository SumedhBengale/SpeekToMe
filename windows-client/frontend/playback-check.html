<!doctype html><meta charset="utf-8"><title>Native playback check</title><p id="status">Checking synthetic audio playback and seeking…</p><audio id="player" muted preload="metadata"></audio><script>
(async()=>{
 const player=document.getElementById('player');let finished=false;
 async function report(passed){if(finished)return;finished=true;document.getElementById('status').textContent=passed?'Playback and seeking passed.':'Playback failed.';await window.__TAURI__.core.invoke('diagnostic_result',{passed,duration:Number.isFinite(player.duration)?player.duration:0,seek:player.currentTime});}
 player.onerror=()=>report(false);
 player.onloadedmetadata=async()=>{if(!(player.duration>=90))return report(false);try{await player.play();player.currentTime=75.5;}catch{return report(false);}};
 player.onseeked=()=>setTimeout(()=>report(player.currentTime>=75.5&&!player.paused),150);
 player.src=window.playbackTicket;
 setTimeout(()=>report(false),9000);
})();
</script>
