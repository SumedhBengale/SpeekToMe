# Install on the MAIN coordinator, not the diarization worker:
# /etc/systemd/system/speektome.service.d/30-diarization.conf
[Service]
LoadCredential=diarization.token:/etc/speektome-diarization/token
Environment=SPEEKTOME_DIARIZATION_URL=http://DIARIZATION_PRIVATE_IP:8081
Environment=SPEEKTOME_DIARIZATION_TOKEN_FILE=/run/credentials/speektome.service/diarization.token
